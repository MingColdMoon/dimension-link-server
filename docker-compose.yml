services:
  postgres:
    image: postgres:16-alpine
    container_name: dimension-link-postgres
    environment:
      POSTGRES_USER: dimension
      POSTGRES_PASSWORD: dimension
      POSTGRES_DB: dimension_link
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimension -d dimension_link"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dimension-link-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["full"]
    build: .
    container_name: dimension-link-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dimension
      POSTGRES_PASSWORD: dimension
      POSTGRES_DB: dimension_link
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_EXPIRES_IN: 2h
      JWT_REFRESH_EXPIRES_IN: 30d
      LOG_LEVEL: info

volumes:
  pgdata:
